<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A designed mobile number field caught in its error state, and the same component written as React code beside it. Labelled DESIGN and CODE. Keep it simple.">
  <style>
    .scan { opacity: 0 }
    @media (prefers-reduced-motion: no-preference) { .scan { opacity: .10 } }
  </style>
  <defs><clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="17"/></clipPath></defs>

  <rect x="1" y="1" width="1198" height="298" rx="17" fill="#F7F5EF" stroke="#E4E0D2"/>
  <rect x="1" y="1" width="1198" height="9" fill="#B3491B" clip-path="url(#card)"/>

  <text x="24" y="44" fill="#B3491B" font-size="14" letter-spacing="3" font-weight="700">DESIGN</text>
  <text x="1176" y="44" fill="#B3491B" font-size="14" letter-spacing="3" font-weight="700" text-anchor="end">CODE</text>

  <rect x="24" y="60" width="514" height="152" rx="12" fill="#FFFEFB" stroke="#E4E0D2"/>
  <text x="48" y="102.0" fill="#16150F" font-size="14" font-weight="600">Mobile number</text>
  <rect x="48" y="114.0" width="326" height="42" rx="8" fill="#FFFFFF" stroke="#B3491B" stroke-width="1.5"/>
  <text x="64" y="140.8" fill="#6E6A5E" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+91</text>
  <rect x="98" y="124.5" width="2" height="21" fill="#16150F">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <rect x="394" y="114.0" width="120" height="42" rx="8" fill="#16150F"/>
  <text x="454" y="140.4" fill="#F7F5EF" font-size="15" font-weight="600" text-anchor="middle">Continue</text>
  <path d="M55.0 166.8 L61.4 179.0 L48.6 179.0 Z" fill="#B3491B" stroke="#B3491B" stroke-width="1.1" stroke-linejoin="round"/>
  <rect x="54.20" y="170.8" width="1.61" height="4.2" rx="0.81" fill="#FFFEFB"/>
  <rect x="54.20" y="176.1" width="1.61" height="1.61" rx="0.81" fill="#FFFEFB"/>
  <text x="69.0" y="177.7" fill="#B3491B" font-size="13" font-weight="600">Enter all 10 digits</text>

  <line x1="566" y1="66" x2="566" y2="206" stroke="#E4E0D2"/>
  <circle cx="566" cy="136" r="15" fill="#F7F5EF" stroke="#E4E0D2"/>
  <text x="566" y="141" fill="#B3491B" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">&#8594;</text>

  <rect x="594" y="60" width="582" height="152" rx="12" fill="#FFFEFB" stroke="#E4E0D2"/>
  <line x1="628" y1="66" x2="628" y2="206" stroke="#E4E0D2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#8F8A7A" text-anchor="end">
    <text x="622" y="87">1</text>
    <text x="622" y="106">2</text>
    <text x="622" y="125">3</text>
    <text x="622" y="144">4</text>
    <text x="622" y="163">5</text>
    <text x="622" y="182">6</text>
    <text x="622" y="201">7</text>
  </g>

  <rect class="scan" x="636" y="73" width="532" height="19" rx="3" fill="#B3491B">
    <animate attributeName="y" dur="4.2s" calcMode="discrete" repeatCount="indefinite"
      values="73;92;111;130;149;168;187"/>
  </rect>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" xml:space="preserve">
    <text x="644" y="87"><tspan fill="#6E6A5E">&lt;</tspan><tspan fill="#16150F" font-weight="600">Field</tspan></text>
    <text x="662" y="106"><tspan fill="#16150F">label</tspan><tspan fill="#6E6A5E">=</tspan><tspan fill="#B3491B">"Mobile number"</tspan></text>
    <text x="662" y="125"><tspan fill="#16150F">prefix</tspan><tspan fill="#6E6A5E">=</tspan><tspan fill="#B3491B">"+91"</tspan></text>
    <text x="662" y="144"><tspan fill="#16150F">error</tspan><tspan fill="#6E6A5E">=</tspan><tspan fill="#B3491B">"Enter all 10 digits"</tspan></text>
    <text x="644" y="163"><tspan fill="#6E6A5E">&gt;</tspan></text>
    <text x="662" y="182"><tspan fill="#6E6A5E">&lt;</tspan><tspan fill="#16150F" font-weight="600">Button</tspan><tspan fill="#6E6A5E">&gt;Continue&lt;/</tspan><tspan fill="#16150F" font-weight="600">Button</tspan><tspan fill="#6E6A5E">&gt;</tspan></text>
    <text x="644" y="201"><tspan fill="#6E6A5E">&lt;/</tspan><tspan fill="#16150F" font-weight="600">Field</tspan><tspan fill="#6E6A5E">&gt;</tspan></text>
  </g>

  <line x1="24" y1="240" x2="1176" y2="240" stroke="#E4E0D2"/>
  <text x="1176" y="270" font-size="17" font-weight="700" text-anchor="end"><tspan fill="#8F8A7A">#</tspan><tspan fill="#B3491B">keep</tspan><tspan fill="#16150F">it</tspan><tspan fill="#B3491B">simple</tspan></text>
</svg>
